<title>Bancada de Mecanismos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prancheta técnica — ferramentas à esquerda (desktop) ou embaixo (celular), canvas SVG ao centro, painel de camadas/propriedades à direita ou como folha inferior. */
:root {
  --paper: #EDEFEC; --paper-2: #E2E6E2; --panel: #F6F7F5; --ink: #1C2321; --ink-2: #56625E; --ink-3: #8A9591;
  --rule: #C9CFCA; --grid-minor: #D9DEDA; --grid-major: #C3CAC5;
  --accent: #2747B5; --accent-soft: rgba(39,71,181,.12); --on-accent: #FFFFFF;
  --hot: #E0662A; --hot-soft: rgba(224,102,42,.18); --ok: #2F7D4F; --danger: #B3261E;
  --pin: #F6F7F5; --shadow: rgba(20,26,24,.18);
  --m-aco: #A4ADB2; --m-aluminio: #CDD3D6; --m-latao: #CCAA5C; --m-polimero: #4A5153; --m-borracha: #8A4A40; --m-madeira: #B48A5C;
  --L0: #C2410C; --L1: #1D4ED8; --L2: #15803D; --L3: #9333EA; --L4: #0E7490; --L5: #B91C1C; --L6: #A16207; --L7: #DB2777;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --foot: 112px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141817; --paper-2: #1A1F1E; --panel: #1E2423; --ink: #DCE3E0; --ink-2: #A0ACA8; --ink-3: #6C7774;
  --rule: #2F3735; --grid-minor: #1D2322; --grid-major: #283130;
  --accent: #849CF2; --accent-soft: rgba(132,156,242,.16); --on-accent: #0E1220;
  --hot: #FF8A4C; --hot-soft: rgba(255,138,76,.22); --ok: #5FBF86; --danger: #F2827A;
  --pin: #2A3130; --shadow: rgba(0,0,0,.4);
  --m-aco: #6E7A80; --m-aluminio: #96A1A6; --m-latao: #A88B45; --m-polimero: #39403F; --m-borracha: #8E4C42; --m-madeira: #8E6A44;
  --L0: #FB923C; --L1: #7FA2FF; --L2: #4ADE80; --L3: #C084FC; --L4: #22D3EE; --L5: #F87171; --L6: #FACC15; --L7: #F472B6;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #141817; --paper-2: #1A1F1E; --panel: #1E2423; --ink: #DCE3E0; --ink-2: #A0ACA8; --ink-3: #6C7774;
  --rule: #2F3735; --grid-minor: #1D2322; --grid-major: #283130;
  --accent: #849CF2; --accent-soft: rgba(132,156,242,.16); --on-accent: #0E1220;
  --hot: #FF8A4C; --hot-soft: rgba(255,138,76,.22); --ok: #5FBF86; --danger: #F2827A;
  --pin: #2A3130; --shadow: rgba(0,0,0,.4);
  --m-aco: #6E7A80; --m-aluminio: #96A1A6; --m-latao: #A88B45; --m-polimero: #39403F; --m-borracha: #8E4C42; --m-madeira: #8E6A44;
  --L0: #FB923C; --L1: #7FA2FF; --L2: #4ADE80; --L3: #C084FC; --L4: #22D3EE; --L5: #F87171; --L6: #FACC15; --L7: #F472B6;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto;
  grid-template-areas: "top" "stage" "layers" "tools"; position: relative; }

/* topo */
.top { grid-area: top; display: flex; align-items: center; gap: 6px; min-height: 52px; border-bottom: 1px solid var(--rule); background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; overflow: hidden; }
.brand svg { flex: none; color: var(--accent); }
.brand .name { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.brand .proj { font-family: var(--f-display); font-weight: 500; font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand .sep { color: var(--ink-3); }
.iconbtn { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--paper-2); }
.iconbtn:disabled { opacity: .35; cursor: default; background: none; }
.play { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; flex: none; }
.mode-sim .play { background: var(--panel); color: var(--accent); }

/* palco */
.stage { grid-area: stage; position: relative; overflow: hidden; min-height: 0; background: var(--paper); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
.hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100% - 24px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--ink-2); box-shadow: 0 2px 10px var(--shadow); pointer-events: auto; text-align: center; }
.hint:empty { display: none; }
.hint button { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.hint button.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.titleblock { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: 10px; display: grid; grid-template-columns: auto auto; border: 1px solid var(--ink-3); background: var(--panel);
  font-size: 11px; pointer-events: none; opacity: .92; }
.titleblock div { padding: 3px 7px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); white-space: nowrap; }
.titleblock .k { font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.titleblock .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.zoombox { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoombox button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); display: grid; place-items: center; }
.toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: max-content; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 13px;
  max-width: calc(100% - 32px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 5; }
.toast.on { opacity: 1; }

/* ferramentas */
.tools { grid-area: tools; min-width: 0; display: flex; gap: 2px; overflow-x: auto; background: var(--panel); border-top: 1px solid var(--rule); scrollbar-width: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px; }
.tools::-webkit-scrollbar { display: none; }
.tgroup { display: flex; gap: 2px; padding-right: 6px; margin-right: 4px; border-right: 1px solid var(--rule); }
.tgroup:last-child { border-right: 0; }
.tool { flex: none; min-width: 62px; padding: 0 5px; height: 56px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid transparent; border-radius: 9px;
  background: none; color: var(--ink-2); font-family: var(--f-display); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.tool:hover { background: var(--paper-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* faixa de camadas (celular) */
.layerstrip { grid-area: layers; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; background: var(--paper-2); border-top: 1px solid var(--rule); scrollbar-width: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.layerstrip::-webkit-scrollbar { display: none; }
.lchip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--rule); background: var(--panel);
  font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--ink-2); }
.lchip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lc); }
.lchip[aria-pressed="true"] { border-color: var(--lc); color: var(--ink); box-shadow: inset 0 0 0 1px var(--lc); }
.lchip.off { opacity: .5; }
.lchip.ghost { border-style: dashed; }
.striplabel { flex: none; font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

/* painel / folha */
.panel { position: fixed; left: 0; right: 0; bottom: var(--foot); max-height: 56%; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--rule);
  border-radius: 14px 14px 0 0; box-shadow: 0 -6px 24px var(--shadow); z-index: 4; }
.panel[hidden] { display: none !important; }
.sheethead { display: flex; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); }
.sheethead .ttl { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheethead .sub { font-family: var(--f-body); font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-3); margin-left: 6px; }
.panelbody { overflow-y: auto; min-height: 0; padding-block: 0 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel.collapsed .panelbody { display: none; }
.sec { padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.sec + .sec { border-top: 1px solid var(--rule); margin-top: 12px; }
.sech { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.sech .grow { flex: 1; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; align-items: center; }
.row label { font-size: 13px; color: var(--ink-2); }
.row input[type=number], .row input[type=text], .row select { width: 100%; height: 34px; border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); padding: 0 8px; min-width: 0; }
.row input[type=number] { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.unit { position: relative; }
.unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); pointer-events: none; font-family: var(--f-mono); }
.unit input { padding-right: 34px !important; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 .cell label { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 3px; font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.grid3 input { width: 100%; height: 34px; border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); padding: 0 6px; font-family: var(--f-mono); font-size: 13px; min-width: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; font-size: 13px; color: var(--ink-2); }
.switch input { appearance: none; -webkit-appearance: none; width: 40px; height: 22px; border-radius: 11px; background: var(--rule); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.note { font-size: 12px; color: var(--ink-3); line-height: 1.45; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--rule); background: var(--paper); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.btn:hover { border-color: var(--ink-3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); }
.readout { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); }

.layerlist { display: flex; flex-direction: column; gap: 4px; }
.lrow { display: grid; grid-template-columns: 14px 16px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 2px 3px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.lrow.active { border-color: var(--lc); box-shadow: inset 3px 0 0 var(--lc); }
.lrow .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--lc); }
.lrow .num { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.lrow input { border: 0; background: none; height: 30px; min-width: 0; width: 100%; font-weight: 500; padding: 0 4px; border-radius: 5px; }
.lrow input:focus { background: var(--panel); }
.lrow .acts { display: flex; gap: 0; }
.lrow .acts button { width: 28px; height: 30px; border: 0; background: none; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.lrow .acts button:hover { background: var(--paper-2); color: var(--ink); }
.lrow .meta { display: flex; flex-direction: column; min-width: 0; }
.lrow .cnt { font-size: 11px; color: var(--ink-3); padding-left: 4px; margin-top: -4px; }

/* simulação */
.simbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; display: none; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 6px;
  box-shadow: 0 4px 18px var(--shadow); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; z-index: 3; }
.mode-sim .simbar { display: flex; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; height: 34px; padding: 0 9px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.fire { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hot); background: var(--hot-soft); color: var(--ink); font-family: var(--f-display); font-weight: 600; letter-spacing: .05em; font-size: 14px; text-transform: uppercase; }
.fire:disabled { opacity: .45; cursor: default; }
.mode-sim .tools, .mode-sim .layerstrip { display: none; }
.mode-sim .zoombox { bottom: 70px; }
.mode-sim .toast { bottom: 130px; }
@media (max-width: 560px) { .brand .name, .brand .sep { display: none; } .hint { font-size: 12px; padding: 6px 10px; } .titleblock { font-size: 10px; } }
.mode-sim .titleblock { display: none; }

/* menu e modal */
.menu { position: absolute; top: 54px; right: calc(10px + env(safe-area-inset-right, 0px)); width: min(300px, calc(100% - 20px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 10px 30px var(--shadow); z-index: 10; padding: 6px; max-height: calc(100% - 70px); overflow-y: auto; }
.menu .mh { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 4px; }
.menu button.mi { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; font-size: 14px; }
.menu button.mi:hover { background: var(--paper-2); }
.menu .mi small { color: var(--ink-3); font-size: 12px; margin-left: auto; }
.menu .switch { padding: 2px 10px; font-size: 14px; color: var(--ink); }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 4px; }
.modal { position: fixed; inset: 0; background: rgba(10,14,13,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal .box { width: min(520px, 100%); background: var(--panel); border-radius: 14px; border: 1px solid var(--rule); padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 90%; }
.modal h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .03em; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-2); line-height: 1.5; }
.modal textarea { width: 100%; min-height: 200px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 10px; font-family: var(--f-mono); font-size: 12px; resize: vertical; }
.modal .btnrow { justify-content: flex-end; }

/* svg */
.part path.body { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.ly0 { stroke: var(--L0); } .ly1 { stroke: var(--L1); } .ly2 { stroke: var(--L2); } .ly3 { stroke: var(--L3); }
.ly4 { stroke: var(--L4); } .ly5 { stroke: var(--L5); } .ly6 { stroke: var(--L6); } .ly7 { stroke: var(--L7); }
.m-aco { fill: var(--m-aco); } .m-aluminio { fill: var(--m-aluminio); } .m-latao { fill: var(--m-latao); }
.m-polimero { fill: var(--m-polimero); } .m-borracha { fill: var(--m-borracha); } .m-madeira { fill: var(--m-madeira); }
.halo { fill: none; stroke: var(--accent); stroke-opacity: .45; vector-effect: non-scaling-stroke; }
.mark { fill: none; stroke: var(--ink); stroke-opacity: .55; vector-effect: non-scaling-stroke; }
.lk { vector-effect: non-scaling-stroke; }
.lk-ink { stroke: var(--ink); fill: var(--pin); }
.lk-acc { stroke: var(--accent); fill: var(--pin); }
.lk-line { stroke: var(--ink-2); fill: none; }
.lk-spring { stroke: var(--ink); fill: none; stroke-linejoin: round; }
.lk-hot { stroke: var(--hot); fill: none; }
.lk-hotfill { fill: var(--hot); stroke: none; }
.lk-sel { stroke: var(--accent); }
.lk-ground { stroke: var(--ink-2); fill: none; }
.lk-text { fill: var(--ink-2); font-family: var(--f-mono); }
.tmp { fill: var(--accent-soft); stroke: var(--accent); vector-effect: non-scaling-stroke; }
.tmpline { fill: none; stroke: var(--accent); vector-effect: non-scaling-stroke; }
.hnd { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
.hnd-line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
.fx-flash { fill: var(--hot); }
.fx-smoke { fill: var(--ink-3); }

@media (min-width: 900px) {
  #app { grid-template-columns: calc(86px + env(safe-area-inset-left, 0px)) minmax(0, 1fr) 330px; grid-template-rows: auto 1fr; grid-template-areas: "top top top" "tools stage panel"; }
  #app.mode-sim { grid-template-columns: 0 minmax(0, 1fr) 330px; }
  .tools { flex-direction: column; overflow-x: hidden; overflow-y: auto; border-top: 0; border-right: 1px solid var(--rule); padding: 8px 6px; padding-left: max(6px, env(safe-area-inset-left, 0px)); align-items: center; }
  .tgroup { flex-direction: column; border-right: 0; padding-right: 0; margin-right: 0; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--rule); }
  .tgroup:last-child { border-bottom: 0; }
  .tool { width: 70px; min-width: 0; height: 49px; font-size: 11.5px; }
  .layerstrip { display: none !important; }
  .panel { grid-area: panel; position: static; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--rule); box-shadow: none; z-index: auto; min-height: 0; }
  .panel[hidden] { display: flex !important; }
  .panel.collapsed .panelbody { display: block; }
  .sheethead .close, .sheethead .collapse { display: none; }
  .toast { bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app" class="mode-edit">
  <header class="top">

<script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>

<script>
/* Bancada de Mecanismos — motor (geometria, física em camadas, exemplos) */
(function (root) {
  'use strict';
  var PL = root.planck || (typeof require === 'function' ? require('planck') : null);
  var DECOMP = root.decomp || (typeof require === 'function' ? require('poly-decomp') : null);

  var S = 50; // px por unidade de física
  var PI = Math.PI;

  var MATERIALS = {
    aco:       { name: 'Aço',       density: 7.8, friction: 0.25, restitution: 0.05 },
    aluminio:  { name: 'Alumínio',  density: 2.7, friction: 0.3,  restitution: 0.05 },
    latao:     { name: 'Latão',     density: 8.5, friction: 0.2,  restitution: 0.05 },
    polimero:  { name: 'Polímero',  density: 1.2, friction: 0.4,  restitution: 0.1 },

  /* ---------- vetores ---------- */
  function rot(p, a) { var c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }

  function shapeOutline(sh) {

  }

    res.forEach(function (p) { splitBig(p, 10).forEach(function (q) { if (q.length >= 3 && Math.abs(signedArea(q)) > 0.6) out.push(q); }); });

    return out;
  }
  function shapePieces(sh) {
    if (sh.type === 'circle') return [{ type: 'circle', c: [0, 0], r: sh.r }];
    if (sh.type === 'gear') {
      var g = gearProfile(sh), out = [{ type: 'circle', c: [0, 0], r: g.rr }];
      g.teeth.forEach(function (t) { out.push({ type: 'poly', pts: t }); });
      return out;
    }
    return polyPieces(sh.pts).map(function (p) { return { type: 'poly', pts: p }; });
  }

  /* ---------- cena ---------- */
  function layerOrder(scene) { var m = {}; scene.layers.forEach(function (L, i) { m[L.id] = i; }); return m; }
  function findPart(scene, id) { for (var i = 0; i < scene.parts.length; i++) if (scene.parts[i].id === id) return scene.parts[i]; return null; }
  function findLink(scene, id) { for (var i = 0; i < scene.links.length; i++) if (scene.links[i].id === id) return scene.links[i]; return null; }
  function bitsSpan(order, from, to) {
    var a = order[from], b = order[to];
    if (a === undefined) a = 0; if (b === undefined) b = a;
    var lo = Math.min(a, b), hi = Math.max(a, b), m = 0;
    for (var i = lo; i <= hi; i++) m |= (1 << i);

  }

  // pontos de referência de cada ligação no mundo, dado um provedor de pose
  function linkGeom(scene, L, poseOf) {
    function W(partId, p) { if (!partId) return [p[0], p[1]]; var pose = poseOf(partId); return pose ? toWorld(pose, p) : [p[0], p[1]]; }
    function ang(partId, a) { if (!partId) return a; var pose = poseOf(partId); return (pose ? pose.a : 0) + a; }
    switch (L.type) {
      case 'screw': case 'axle': return { p: W(L.b, L.p) };
      case 'pin': case 'sensor': return { p: W(L.host, L.p) };
      case 'slider': {
        var p = W(L.b, L.p), a = ang(L.b, L.dir);
        return { p: p, a: a };
      }
      case 'spring': return { pa: W(L.a, L.pa), pb: W(L.b, L.pb) };
      case 'chamber': return { p: W(L.a, L.p), a: ang(L.a, L.dir) };
    }
    return {};
  }

  /* ---------- simulação ---------- */
  function build(scene) {
    var V = PL.Vec2;
    var st = scene.settings || {};
    var world = new PL.World({ gravity: V(0, st.gravity === false ? 0 : (st.g || 10)) });
    var ground = world.createBody();
    var order = layerOrder(scene);
    var parts = scene.parts.filter(function (p) { return order[p.layer] !== undefined; });
    var byId = {}; parts.forEach(function (p) { byId[p.id] = p; });
    var warnings = [];

    // grupos rígidos (parafusos)
    var parent = {}; parts.forEach(function (p) { parent[p.id] = p.id; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    var fixedRoot = {};
    scene.links.forEach(function (L) {
      if (L.type !== 'screw' || !byId[L.b]) return;
      if (L.a && byId[L.a]) { parent[find(L.a)] = find(L.b); }
      else if (!L.a) { fixedRoot[L.b] = true; }
    });
    var groups = {};
    parts.forEach(function (p) { var r = find(p.id); (groups[r] = groups[r] || []).push(p); });
    var bodyOf = {}, rel = {}, groupFixed = {};
    Object.keys(groups).forEach(function (r) {
      var g = groups[r], fixed = g.some(function (p) { return p.fixed || fixedRoot[p.id]; });
      var o = partPose(g[0]);

        type: fixed ? 'static' : 'dynamic',
        position: V(o.x / S, o.y / S), angle: o.a,
        bullet: g.some(function (p) { return p.bullet; }),
        allowSleep: false, angularDamping: 0.02, linearDamping: 0.0
      });
      g.forEach(function (p) {
        var pose = partPose(p), mat = MATERIALS[p.material] || MATERIALS.aco;
        var bit = 1 << order[p.layer];
        var lp = toLocal(o, [pose.x, pose.y]);
        rel[p.id] = { x: lp[0], y: lp[1], a: pose.a - o.a };
        bodyOf[p.id] = body;
        shapePieces(p.shape).forEach(function (pc) {
          var shape;
          if (pc.type === 'circle') {
            var c = toLocal(o, toWorld(pose, pc.c));
            shape = new PL.Circle(V(c[0] / S, c[1] / S), pc.r / S);
          } else {
            shape = new PL.Polygon(pc.pts.map(function (q) { var w = toLocal(o, toWorld(pose, q)); return V(w[0] / S, w[1] / S); }));
          }

          fx.setUserData({ part: p.id });

      });
      if (!fixed && body.getMass() <= 0) body.setMassData({ mass: 1, center: V(0, 0), I: 1 });
      groupFixed[r] = fixed;
    });

    function poseOf(id) {
      var b = bodyOf[id], r = rel[id]; if (!b) return null;
      var p = b.getWorldPoint(V(r.x / S, r.y / S));
      return { x: p.x * S, y: p.y * S, a: b.getAngle() + r.a };
    }
    function designPose(id) { var p = byId[id]; return p ? partPose(p) : null; }
    function bodyFor(id) { return id && bodyOf[id] ? bodyOf[id] : ground; }

    var torsions = [], sliders = [], springs = [], chambers = [], sensors = {}, joints = {};

    scene.links.forEach(function (L) {
      var g = linkGeom(scene, L, designPose);
      if (L.type === 'axle') {
        if (!byId[L.b]) return;
        var A = bodyFor(L.a), B = bodyFor(L.b);
        if (A === B) { warnings.push('Eixo ligando peças já parafusadas entre si foi ignorado.'); return; }
        var j = world.createJoint(new PL.RevoluteJoint({
          enableLimit: !!L.limitOn, lowerAngle: (L.lower || 0) * PI / 180, upperAngle: (L.upper || 0) * PI / 180,
          enableMotor: !!L.motorOn, motorSpeed: (L.rpm || 0) * 2 * PI / 60, maxMotorTorque: L.torque || 0,
          collideConnected: false
        }, A, B, V(g.p[0] / S, g.p[1] / S)));
        joints[L.id] = j;
        if ((L.tk || 0) > 0 || (L.td || 0) > 0) torsions.push({ j: j, A: A, B: B, k: L.tk || 0, rest: (L.trest || 0) * PI / 180, c: L.td || 0 });
      } else if (L.type === 'slider') {
        if (!byId[L.b]) return;
        var A2 = bodyFor(L.a), B2 = bodyFor(L.b);
        if (A2 === B2) { warnings.push('Trilho entre peças parafusadas foi ignorado.'); return; }
        var ax = [Math.cos(g.a), Math.sin(g.a)];
        var j2 = world.createJoint(new PL.PrismaticJoint({
          enableLimit: true, lowerTranslation: -(L.back || 0) / S, upperTranslation: (L.travel || 0) / S, collideConnected: false
        }, A2, B2, V(g.p[0] / S, g.p[1] / S), V(ax[0], ax[1])));

        if ((L.k || 0) > 0 || (L.damp || 0) > 0) sliders.push({ j: j2, A: A2, B: B2, axisA: A2.getLocalVector(V(ax[0], ax[1])), k: L.k || 0, rest: (L.rest || 0) / S, c: L.damp || 0 });
      } else if (L.type === 'spring') {
        var Aa = bodyFor(L.a), Bb = bodyFor(L.b);
        if (Aa === Bb) { warnings.push('Mola com as duas pontas na mesma peça foi ignorada.'); return; }

      } else if (L.type === 'chamber') {

          vent: (L.vent || 200) / S, width: (L.width || 20) / S, charge: L.charge || 0, burn: (L.burn || 0) / 1000,

      var bits = bitsSpan(order, L.from || host.layer, L.to || host.layer);
      var fx = b.createFixture(new PL.Circle(V(c[0] / S, c[1] / S), (L.r || 5) / S), {
        density: L.type === 'pin' ? 7.8 : 0, friction: 0.2, restitution: 0.05,
        isSensor: L.type === 'sensor', filterCategoryBits: bits, filterMaskBits: bits
      });
      fx.setUserData(L.type === 'sensor' ? { sensor: L.id, part: L.host } : { pin: L.id, part: L.host });
      if (L.type === 'sensor') sensors[L.id] = { id: L.id, host: b, c: V(c[0] / S, c[1] / S), target: L.target || '', minSpeed: (L.minSpeed || 0) / S, lit: 0, count: 0 };
    });

    var fx = []; // efeitos visuais
    var pending = [];
    world.on('begin-contact', function (contact) {
      var fa = contact.getFixtureA(), fb = contact.getFixtureB();
      [[fa, fb], [fb, fa]].forEach(function (pair) {

    });

    function ignite(ch) {
      if (!ch || ch.fired || !ch.B) return false;

      if (ch.burn <= 0) { ch.gas = ch.charge; ch.burning = false; }

    function applyForces(h) {
      torsions.forEach(function (t) {

/* ---------- criação ---------- */

  var base = layerIdx(activeLayer) === 0;
  var p = { id: newId('p'), name: nameBase + ' ' + count, layer: activeLayer, x: center[0], y: center[1], angle: 0, fixed: base, material: base ? 'aluminio' : 'aco', bullet: false, shape: shape };
  scene.parts.push(p); sel = { kind: 'part', id: p.id }; tool = 'select'; sheetCollapsed = !isWide(); commit(); renderAll();
  if (base) toast('Peças da camada 1 começam fixas, como um corpo. Mude em “Peça fixa”.');
  return p;
}

  var c = E.centroid(pts);
  return newPart({ type: 'poly', pts: pts.map(function (q) { return [round(q[0] - c[0], 2), round(q[1] - c[1], 2)]; }) }, c, nameBase);
}
function finishPoly() {

  if (Math.abs(E.signedArea(pts)) < 20) { toast('Forma pequena demais.'); renderTemp(); renderHint(); return; }

}
function newLink(L) {

  var p0 = a.p0, p1 = a.p1, d = E.dist(p0, p1);
  switch (a.tool) {
    case 'rect': {
      var w = Math.abs(p1[0] - p0[0]), h = Math.abs(p1[1] - p0[1]);
      if (w < 3 || h < 3) { toast('Arraste para definir largura e altura.'); return; }
      var x1 = Math.min(p0[0], p1[0]), y1 = Math.min(p0[1], p1[1]);
      polyFromWorld([[x1, y1], [x1 + w, y1], [x1 + w, y1 + h], [x1, y1 + h]], 'Peça'); return;
    }
    case 'circle': if (d < 3) { toast('Arraste do centro para fora.'); return; } newPart({ type: 'circle', r: round(d, 1) }, p0, 'Círculo'); return;
    case 'gear': {
      if (d < 10) { toast('Arraste do centro para fora.'); return; }
      var n = Math.max(6, Math.round(2 * Math.PI * d / 16)), r = n * 16 / (2 * Math.PI);

svg.addEventListener('pointerdown', function (e) {

/* ---------- menu e modais ---------- */
function closeMenu() { $('#menu').hidden = true; }

/* ---------- teclado ---------- */

/* ---------- início ---------- */
$('#btnUndo').innerHTML = ic(IC.undo, 20); $('#btnRedo').innerHTML = ic(IC.redo, 20); $('#btnMenu').innerHTML = ic(IC.menu, 20);

function start(data) {

}

})();
